[versions]
androidx-lifecycle = "2.10.0-alpha07"
composeHotReload = "1.0.0-beta01"
composeMultiplatform = "1.11.0-alpha01"
junit = "4.13.2"
kotlin = "2.3.0"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
navigation3 = "1.1.0-alpha01"
sqldelight = "2.2.1"
jna = "5.18.1"
detekt = "2.0.0-alpha.1"
metro = "0.9.3"
leakcanary = "2.14"
navigation-adaptive = "1.3.0-alpha03"
compose-icons = "1.7.3"
datastore = "1.2.0"


[libraries]
# Compose
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime-desktop", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation-desktop", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui-desktop", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatform" }
compose-icons = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-icons" }

# resources + previews
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources-desktop", version.ref = "composeMultiplatform" }
compose-components-ui-tooling-preview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview-desktop", version.ref = "composeMultiplatform" }

# metro (runtime + optional metrox helpers)
metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro" }
metro-metrox-viewmodel-base = { module = "dev.zacsweers.metro:metrox-viewmodel", version.ref = "metro" }
metro-metrox-viewmodel-compose = { module = "dev.zacsweers.metro:metrox-viewmodel-compose", version.ref = "metro" }
gradle-metro-plugin = { module = "dev.zacsweers.metro:dev.zacsweers.metro.gradle.plugin", version.ref = "metro" }

# tests
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

# coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

# lifecycle (Compose MPP)
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-compose-plugin = { module = "org.jetbrains.compose:org.jetbrains.compose.gradle.plugin", version.ref = "composeMultiplatform" }
gradle-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradle-sqldelight = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
gradle-detekt-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradle-compose-hot-reload = { module = "org.jetbrains.compose.hot-reload:org.jetbrains.compose.hot-reload.gradle.plugin", version.ref = "composeHotReload" }

# navigation3 (KMP)
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui-desktop", version.ref = "navigation3" }
compose-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "navigation-adaptive" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

# sqldelight
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# win shared memory (JNA)
jna-base = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

leakcanary-objectWatcher = { module = "com.squareup.leakcanary:leakcanary-object-watcher", version.ref = "leakcanary" }
leakcanary-shark = { module = "com.squareup.leakcanary:shark", version.ref = "leakcanary" }
leakcanary-sharkLog = { module = "com.squareup.leakcanary:shark-log", version.ref = "leakcanary" }

datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

[plugins]
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

convention-app-plugin = { id = "convention-compose-app" }
convention-module-api-plugin = { id = "convention-module-api" }
convention-module-impl-plugin = { id = "convention-module-impl" }
convention-project-dsl = { id = "convention-project-dsl" }
