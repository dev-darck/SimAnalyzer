name: Publish Release

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Which semver part to bump"
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      build_flavor:
        description: "What to build"
        type: choice
        required: true
        default: release
        options:
          - release
          - dev
          - both
      artifacts:
        description: "Which artifacts to publish"
        type: choice
        required: true
        default: both
        options:
          - both
          - msi
          - portable
      version_channel:
        description: "How release build should be versioned inside the app"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - release
          - dev

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve publish options
        shell: bash
        run: |
          set -euo pipefail

          build_flavor="${{ inputs.build_flavor }}"
          build_artifacts="${{ inputs.artifacts }}"
          version_channel_input="${{ inputs.version_channel }}"

          if [[ "${version_channel_input}" == "auto" ]]; then
            if [[ "${build_flavor}" == "release" || "${build_flavor}" == "both" ]]; then
              if [[ "${GITHUB_REF_NAME}" == "release" || "${GITHUB_REF_NAME}" == release/* ]]; then
                version_channel="release"
              else
                version_channel="dev"
              fi
            else
              version_channel="dev"
            fi
          else
            version_channel="${version_channel_input}"
          fi

          {
            echo "BUILD_FLAVOR=${build_flavor}"
            echo "BUILD_ARTIFACTS=${build_artifacts}"
            echo "VERSION_CHANNEL=${version_channel}"
          } >> "${GITHUB_ENV}"

      - name: Show selected publish options
        shell: pwsh
        run: |
          Write-Host "PART=${{ inputs.part }}"
          Write-Host "BUILD_FLAVOR=$env:BUILD_FLAVOR"
          Write-Host "BUILD_ARTIFACTS=$env:BUILD_ARTIFACTS"
          Write-Host "VERSION_CHANNEL=$env:VERSION_CHANNEL"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wixtoolset --no-progress -y
          candle.exe -? | Select-Object -First 1
          light.exe -?  | Select-Object -First 1

      - name: Install JetBrains Runtime (JBR) 21 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jbrUrl = "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-21.0.9-windows-x64-b1163.86.zip"
          $zip = Join-Path $env:RUNNER_TEMP "jbrsdk.zip"
          Invoke-WebRequest -Uri $jbrUrl -OutFile $zip

          $dest = Join-Path $env:RUNNER_TEMP "jbr"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $jbrHome = (Get-ChildItem $dest | Where-Object { $_.PSIsContainer } | Select-Object -First 1).FullName
          "JAVA_HOME=$jbrHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$jbrHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          java -version

      - name: Setup Kotlin CLI
        shell: bash
        run: |
          set -euo pipefail
          KOTLIN_VERSION="$(grep '^kotlin = "' gradle/libs.versions.toml | sed -E 's/^kotlin = "([^"]+)"/\1/')"
          ZIP_PATH="$RUNNER_TEMP/kotlin-compiler.zip"
          DEST_DIR="$RUNNER_TEMP/kotlin-cli"
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$DEST_DIR"
          echo "$DEST_DIR/kotlinc/bin" >> "$GITHUB_PATH"
          "$DEST_DIR/kotlinc/bin/kotlinc" -version

      - name: Bump selected version part
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts bump "${{ inputs.part }}" version.properties

      - name: Resolve DEV version metadata
        if: env.BUILD_FLAVOR == 'dev' || env.BUILD_FLAVOR == 'both'
        id: dev_version
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts describe dev version.properties

      - name: Resolve RELEASE version metadata
        if: env.BUILD_FLAVOR == 'release' || env.BUILD_FLAVOR == 'both'
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts describe "${VERSION_CHANNEL}" version.properties

      - name: Resolve publish target metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${BUILD_FLAVOR}" == "dev" ]]; then
            publish_tag="${{ steps.dev_version.outputs.tag }}"
            publish_display="${{ steps.dev_version.outputs.display }}"
            publish_prerelease="${{ steps.dev_version.outputs.prerelease }}"
            publish_base="${{ steps.dev_version.outputs.base }}"
          else
            publish_tag="${{ steps.release_version.outputs.tag }}"
            publish_display="${{ steps.release_version.outputs.display }}"
            publish_prerelease="${{ steps.release_version.outputs.prerelease }}"
            publish_base="${{ steps.release_version.outputs.base }}"
          fi

          {
            echo "PUBLISH_TAG=${publish_tag}"
            echo "PUBLISH_DISPLAY=${publish_display}"
            echo "PUBLISH_PRERELEASE=${publish_prerelease}"
            echo "PUBLISH_BASE=${publish_base}"
          } >> "${GITHUB_ENV}"

      - name: Prepare release notes source
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-meta

          version_notes="changes/${PUBLISH_BASE}.md"
          fallback_notes="changes/unreleased.md"
          notes_path="dist/release-meta/release-notes.md"

          if [[ -f "${version_notes}" ]]; then
            cp "${version_notes}" "${notes_path}"
          elif [[ -f "${fallback_notes}" ]]; then
            cp "${fallback_notes}" "${notes_path}"
          else
            printf '%s\n' "No curated release notes were provided for this release." > "${notes_path}"
          fi

          echo "notes_path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "No version change detected"
            exit 1
          fi

          user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: publish ${PUBLISH_DISPLAY} [skip ci]"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Suggest runtime modules
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew -q :composeApp:tasks --all | grep -q "suggestRuntimeModules"; then
            ./gradlew --no-daemon :composeApp:suggestRuntimeModules
          else
            ./gradlew --no-daemon :composeApp:suggestModules
          fi

      - name: Build DEV
        if: env.BUILD_FLAVOR == 'dev' || env.BUILD_FLAVOR == 'both'
        shell: bash
        run: |
          set -euo pipefail
          echo "Building DEV (BUILD_ARTIFACTS=${BUILD_ARTIFACTS})"

          if [[ "${BUILD_ARTIFACTS}" == "portable" ]]; then
            ./gradlew --no-daemon --stacktrace -PbuildType=debug -PversionChannel=dev -PisPortable=true :composeApp:createDistributable
          elif [[ "${BUILD_ARTIFACTS}" == "msi" ]]; then
            ./gradlew --no-daemon --stacktrace -PbuildType=debug -PversionChannel=dev -PisPortable=false :composeApp:packageMsi
          else
            ./gradlew --no-daemon --stacktrace -PbuildType=debug -PversionChannel=dev -PisPortable=false :composeApp:packageMsi
            ./gradlew --no-daemon --stacktrace -PbuildType=debug -PversionChannel=dev -PisPortable=true :composeApp:createDistributable
          fi

      - name: Prepare DEV portable folder
        if: env.BUILD_ARTIFACTS != 'msi' && (env.BUILD_FLAVOR == 'dev' || env.BUILD_FLAVOR == 'both')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "composeApp\build\compose\binaries\main\app"
          if (-not (Test-Path $src)) { throw "DEV app image not found: $src" }

          $dest = "dist\portable-dev"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Copy-Item -Path (Join-Path $src '*') -Destination $dest -Recurse -Force

      - name: Build RELEASE
        if: env.BUILD_FLAVOR == 'release' || env.BUILD_FLAVOR == 'both'
        shell: bash
        run: |
          set -euo pipefail
          echo "Building RELEASE (BUILD_ARTIFACTS=${BUILD_ARTIFACTS}, VERSION_CHANNEL=${VERSION_CHANNEL})"

          if ./gradlew -q :composeApp:tasks --all | grep -q "packageReleaseDistributable"; then
            DIST_TASK=":composeApp:packageReleaseDistributable"
          else
            DIST_TASK=":composeApp:createReleaseDistributable"
          fi
          echo "Using distributable task: ${DIST_TASK}"

          if [[ "${BUILD_ARTIFACTS}" == "portable" ]]; then
            ./gradlew --no-daemon --stacktrace -PbuildType=release -PversionChannel="${VERSION_CHANNEL}" -PisPortable=true ${DIST_TASK}
          elif [[ "${BUILD_ARTIFACTS}" == "msi" ]]; then
            ./gradlew --no-daemon --stacktrace -PbuildType=release -PversionChannel="${VERSION_CHANNEL}" -PisPortable=false :composeApp:packageReleaseMsi
          else
            ./gradlew --no-daemon --stacktrace -PbuildType=release -PversionChannel="${VERSION_CHANNEL}" -PisPortable=false :composeApp:packageReleaseMsi
            ./gradlew --no-daemon --stacktrace -PbuildType=release -PversionChannel="${VERSION_CHANNEL}" -PisPortable=true ${DIST_TASK}
          fi

      - name: Prepare RELEASE portable folder
        if: env.BUILD_ARTIFACTS != 'msi' && (env.BUILD_FLAVOR == 'release' || env.BUILD_FLAVOR == 'both')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "composeApp\build\compose\binaries\main-release\app"
          if (-not (Test-Path $src)) { throw "RELEASE app image not found: $src" }

          $dest = "dist\portable-release"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Copy-Item -Path (Join-Path $src '*') -Destination $dest -Recurse -Force

      - name: Prepare publish assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetsDir = "dist\release-assets"
          if (Test-Path $assetsDir) { Remove-Item $assetsDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          if (($env:BUILD_FLAVOR -eq "dev" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "portable") {
            $msi = Get-ChildItem "composeApp\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
            if (-not $msi) { throw "DEV MSI not found" }
            Copy-Item $msi.FullName (Join-Path $assetsDir "SimAnalyzer-${{ steps.dev_version.outputs.artifact_version }}-windows-dev.msi")
          }

          if (($env:BUILD_FLAVOR -eq "dev" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "msi") {
            $portableDir = "dist\portable-dev"
            if (-not (Test-Path $portableDir)) { throw "DEV portable directory not found: $portableDir" }
            Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath (Join-Path $assetsDir "SimAnalyzer-${{ steps.dev_version.outputs.artifact_version }}-windows-dev-portable.zip") -Force
          }

          if (($env:BUILD_FLAVOR -eq "release" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "portable") {
            $msi = Get-ChildItem "composeApp\build\compose\binaries\main-release\msi\*.msi" | Select-Object -First 1
            if (-not $msi) { throw "RELEASE MSI not found" }
            Copy-Item $msi.FullName (Join-Path $assetsDir "SimAnalyzer-${{ steps.release_version.outputs.artifact_version }}-windows.msi")
          }

          if (($env:BUILD_FLAVOR -eq "release" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "msi") {
            $portableDir = "dist\portable-release"
            if (-not (Test-Path $portableDir)) { throw "RELEASE portable directory not found: $portableDir" }
            Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath (Join-Path $assetsDir "SimAnalyzer-${{ steps.release_version.outputs.artifact_version }}-windows-portable.zip") -Force
          }

      - name: Ensure release tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${PUBLISH_TAG}" | grep -q .; then
            echo "Tag ${PUBLISH_TAG} already exists"
            exit 1
          fi

      - name: Create local release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${PUBLISH_TAG}"

      - name: Push release commit and tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${PUBLISH_TAG}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh --version

          extra_notes="$(cat "${{ steps.notes.outputs.notes_path }}")"
          prerelease_args=()
          if [[ "${PUBLISH_PRERELEASE}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${PUBLISH_TAG}" dist/release-assets/* \
            --title "SimAnalyzer ${PUBLISH_DISPLAY}" \
            --notes "${extra_notes}" \
            --generate-notes \
            "${prerelease_args[@]}"
