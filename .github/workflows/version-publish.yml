name: Publish Release

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Which version part to bump"
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
          - build
      build_flavor:
        description: "What to build"
        type: choice
        required: true
        default: release
        options:
          - release
          - dev
          - both
      artifacts:
        description: "Which artifacts to publish"
        type: choice
        required: true
        default: both
        options:
          - both
          - msi
          - portable
      version_channel:
        description: "How release build should be versioned inside the app"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - release
          - dev

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_flavor: ${{ steps.options.outputs.build_flavor }}
      build_artifacts: ${{ steps.options.outputs.build_artifacts }}
      version_channel: ${{ steps.options.outputs.version_channel }}
      dev_artifact_version: ${{ steps.dev_version.outputs.artifact_version }}
      release_artifact_version: ${{ steps.release_version.outputs.artifact_version }}
      publish_tag: ${{ steps.publish_target.outputs.publish_tag }}
      publish_display: ${{ steps.publish_target.outputs.publish_display }}
      publish_prerelease: ${{ steps.publish_target.outputs.publish_prerelease }}
      publish_base: ${{ steps.publish_target.outputs.publish_base }}
      bump_commit_sha: ${{ steps.push_bump.outputs.commit_sha }}

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve publish options
        id: options
        shell: bash
        run: |
          set -euo pipefail

          build_flavor="${{ inputs.build_flavor }}"
          build_artifacts="${{ inputs.artifacts }}"
          version_channel_input="${{ inputs.version_channel }}"

          if [[ "${version_channel_input}" == "auto" ]]; then
            if [[ "${build_flavor}" == "release" || "${build_flavor}" == "both" ]]; then
              if [[ "${GITHUB_REF_NAME}" == "release" || "${GITHUB_REF_NAME}" == release/* ]]; then
                version_channel="release"
              else
                version_channel="dev"
              fi
            else
              version_channel="dev"
            fi
          else
            version_channel="${version_channel_input}"
          fi

          {
            echo "BUILD_FLAVOR=${build_flavor}"
            echo "BUILD_ARTIFACTS=${build_artifacts}"
            echo "VERSION_CHANNEL=${version_channel}"
          } >> "${GITHUB_ENV}"

          {
            echo "build_flavor=${build_flavor}"
            echo "build_artifacts=${build_artifacts}"
            echo "version_channel=${version_channel}"
          } >> "${GITHUB_OUTPUT}"

      - name: Show selected publish options
        shell: bash
        run: |
          set -euo pipefail
          echo "PART=${{ inputs.part }}"
          echo "BUILD_FLAVOR=${BUILD_FLAVOR}"
          echo "BUILD_ARTIFACTS=${BUILD_ARTIFACTS}"
          echo "VERSION_CHANNEL=${VERSION_CHANNEL}"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Kotlin CLI
        shell: bash
        run: |
          set -euo pipefail
          KOTLIN_VERSION="$(grep '^kotlin = "' gradle/libs.versions.toml | sed -E 's/^kotlin = "([^"]+)"/\1/')"
          ZIP_PATH="$RUNNER_TEMP/kotlin-compiler.zip"
          DEST_DIR="$RUNNER_TEMP/kotlin-cli"
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$DEST_DIR"
          echo "$DEST_DIR/kotlinc/bin" >> "$GITHUB_PATH"
          "$DEST_DIR/kotlinc/bin/kotlinc" -version

      - name: Bump selected version part
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts bump "${{ inputs.part }}" version.properties

      - name: Resolve DEV version metadata
        if: env.BUILD_FLAVOR == 'dev' || env.BUILD_FLAVOR == 'both'
        id: dev_version
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts describe dev version.properties

      - name: Resolve RELEASE version metadata
        if: env.BUILD_FLAVOR == 'release' || env.BUILD_FLAVOR == 'both'
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts describe "${VERSION_CHANNEL}" version.properties

      - name: Resolve publish target metadata
        id: publish_target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${BUILD_FLAVOR}" == "dev" ]]; then
            publish_tag="${{ steps.dev_version.outputs.tag }}"
            publish_display="${{ steps.dev_version.outputs.display }}"
            publish_prerelease="${{ steps.dev_version.outputs.prerelease }}"
            publish_base="${{ steps.dev_version.outputs.base }}"
          else
            publish_tag="${{ steps.release_version.outputs.tag }}"
            publish_display="${{ steps.release_version.outputs.display }}"
            publish_prerelease="${{ steps.release_version.outputs.prerelease }}"
            publish_base="${{ steps.release_version.outputs.base }}"
          fi

          {
            echo "PUBLISH_TAG=${publish_tag}"
            echo "PUBLISH_DISPLAY=${publish_display}"
            echo "PUBLISH_PRERELEASE=${publish_prerelease}"
            echo "PUBLISH_BASE=${publish_base}"
          } >> "${GITHUB_ENV}"

          {
            echo "publish_tag=${publish_tag}"
            echo "publish_display=${publish_display}"
            echo "publish_prerelease=${publish_prerelease}"
            echo "publish_base=${publish_base}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare release notes source
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-meta

          version_notes="changes/${PUBLISH_BASE}.md"
          fallback_notes="changes/unreleased.md"
          notes_path="dist/release-meta/release-notes.md"

          if [[ -f "${version_notes}" ]]; then
            cp "${version_notes}" "${notes_path}"
          elif [[ -f "${fallback_notes}" ]]; then
            cp "${fallback_notes}" "${notes_path}"
          else
            printf '%s\n' "No curated release notes were provided for this release." > "${notes_path}"
          fi

          echo "notes_path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Ensure release tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${PUBLISH_TAG}" | grep -q .; then
            echo "Tag ${PUBLISH_TAG} already exists"
            exit 1
          fi

      - name: Commit and push version bump
        id: push_bump
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "No version change detected"
            exit 1
          fi

          user_id="$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "[skip CI] chore: publish ${PUBLISH_DISPLAY}"
          git push origin HEAD:${{ github.ref_name }}
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ steps.notes.outputs.notes_path }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    uses: ./.github/workflows/compose-desktop-windows-build.yml
    with:
      build_flavor: ${{ needs.prepare.outputs.build_flavor }}
      artifacts: ${{ needs.prepare.outputs.build_artifacts }}
      version_channel: ${{ needs.prepare.outputs.version_channel }}
      checkout_ref: ${{ needs.prepare.outputs.bump_commit_sha }}
    secrets: inherit

  release:
    needs:
      - prepare
      - build
    runs-on: windows-latest
    env:
      BUILD_FLAVOR: ${{ needs.prepare.outputs.build_flavor }}
      BUILD_ARTIFACTS: ${{ needs.prepare.outputs.build_artifacts }}
      DEV_ARTIFACT_VERSION: ${{ needs.prepare.outputs.dev_artifact_version }}
      RELEASE_ARTIFACT_VERSION: ${{ needs.prepare.outputs.release_artifact_version }}
      PUBLISH_TAG: ${{ needs.prepare.outputs.publish_tag }}
      PUBLISH_DISPLAY: ${{ needs.prepare.outputs.publish_display }}
      PUBLISH_PRERELEASE: ${{ needs.prepare.outputs.publish_prerelease }}

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist/release-meta

      - name: Download DEV MSI artifact
        if: needs.prepare.outputs.build_artifacts != 'portable' && (needs.prepare.outputs.build_flavor == 'dev' || needs.prepare.outputs.build_flavor == 'both')
        uses: actions/download-artifact@v4
        with:
          name: windows-msi-dev-${{ needs.prepare.outputs.dev_artifact_version }}
          path: dist/downloaded/windows-msi-dev

      - name: Download DEV portable artifact
        if: needs.prepare.outputs.build_artifacts != 'msi' && (needs.prepare.outputs.build_flavor == 'dev' || needs.prepare.outputs.build_flavor == 'both')
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-dev-${{ needs.prepare.outputs.dev_artifact_version }}
          path: dist/downloaded/windows-portable-dev

      - name: Download RELEASE MSI artifact
        if: needs.prepare.outputs.build_artifacts != 'portable' && (needs.prepare.outputs.build_flavor == 'release' || needs.prepare.outputs.build_flavor == 'both')
        uses: actions/download-artifact@v4
        with:
          name: windows-msi-release-${{ needs.prepare.outputs.release_artifact_version }}
          path: dist/downloaded/windows-msi-release

      - name: Download RELEASE portable artifact
        if: needs.prepare.outputs.build_artifacts != 'msi' && (needs.prepare.outputs.build_flavor == 'release' || needs.prepare.outputs.build_flavor == 'both')
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-release-${{ needs.prepare.outputs.release_artifact_version }}
          path: dist/downloaded/windows-portable-release

      - name: Prepare publish assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Resolve-PortableContentRoot([string]$artifactRoot, [string]$expectedLeafName) {
            if (-not (Test-Path $artifactRoot)) {
              throw "Portable artifact root not found: $artifactRoot"
            }
            $candidate = Get-ChildItem $artifactRoot -Directory -Recurse | Where-Object { $_.Name -eq $expectedLeafName } | Select-Object -First 1
            if ($candidate) { return $candidate.FullName }
            return $artifactRoot
          }

          $assetsDir = "dist\release-assets"
          if (Test-Path $assetsDir) { Remove-Item $assetsDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          if (($env:BUILD_FLAVOR -eq "dev" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "portable") {
            $msi = Get-ChildItem "dist\downloaded\windows-msi-dev" -Recurse -Filter *.msi | Select-Object -First 1
            if (-not $msi) { throw "DEV MSI not found in downloaded artifacts" }
            Copy-Item $msi.FullName (Join-Path $assetsDir "SimAnalyzer-$env:DEV_ARTIFACT_VERSION-windows-dev.msi")
          }

          if (($env:BUILD_FLAVOR -eq "dev" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "msi") {
            $portableRoot = Resolve-PortableContentRoot "dist\downloaded\windows-portable-dev" "portable-dev"
            Compress-Archive -Path (Join-Path $portableRoot '*') -DestinationPath (Join-Path $assetsDir "SimAnalyzer-$env:DEV_ARTIFACT_VERSION-windows-dev-portable.zip") -Force
          }

          if (($env:BUILD_FLAVOR -eq "release" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "portable") {
            $msi = Get-ChildItem "dist\downloaded\windows-msi-release" -Recurse -Filter *.msi | Select-Object -First 1
            if (-not $msi) { throw "RELEASE MSI not found in downloaded artifacts" }
            Copy-Item $msi.FullName (Join-Path $assetsDir "SimAnalyzer-$env:RELEASE_ARTIFACT_VERSION-windows.msi")
          }

          if (($env:BUILD_FLAVOR -eq "release" -or $env:BUILD_FLAVOR -eq "both") -and $env:BUILD_ARTIFACTS -ne "msi") {
            $portableRoot = Resolve-PortableContentRoot "dist\downloaded\windows-portable-release" "portable-release"
            Compress-Archive -Path (Join-Path $portableRoot '*') -DestinationPath (Join-Path $assetsDir "SimAnalyzer-$env:RELEASE_ARTIFACT_VERSION-windows-portable.zip") -Force
          }

      - name: Ensure release tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${PUBLISH_TAG}" | grep -q .; then
            echo "Tag ${PUBLISH_TAG} already exists"
            exit 1
          fi

      - name: Create local release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${PUBLISH_TAG}"

      - name: Push release tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${PUBLISH_TAG}"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh --version

          notes_file="$(find dist/release-meta -type f -name 'release-notes.md' | head -n 1)"
          if [[ -z "${notes_file}" ]]; then
            echo "Release notes file was not found"
            exit 1
          fi

          extra_notes="$(cat "${notes_file}")"
          prerelease_args=()
          if [[ "${PUBLISH_PRERELEASE}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${PUBLISH_TAG}" dist/release-assets/* \
            --title "SimAnalyzer ${PUBLISH_DISPLAY}" \
            --notes "${extra_notes}" \
            --generate-notes \
            "${prerelease_args[@]}"
