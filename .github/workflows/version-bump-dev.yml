name: Version Bump

on:
  push:
    branches:
      - "dev"
      - "release"
      - "release/**"
    paths-ignore:
      - "version.properties"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Kotlin CLI
        shell: bash
        run: |
          set -euo pipefail
          KOTLIN_VERSION="$(grep '^kotlin = "' gradle/libs.versions.toml | sed -E 's/^kotlin = "([^"]+)"/\1/')"
          ZIP_PATH="$RUNNER_TEMP/kotlin-compiler.zip"
          DEST_DIR="$RUNNER_TEMP/kotlin-cli"
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$DEST_DIR"
          echo "$DEST_DIR/kotlinc/bin" >> "$GITHUB_PATH"
          "$DEST_DIR/kotlinc/bin/kotlinc" -version

      - name: Bump build number
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          kotlinc -script .github/scripts/version.main.kts bump build version.properties

      - name: Detect version bump changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- version.properties; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change detected"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create version bump PR
        if: steps.diff.outputs.changed == 'true' && github.ref_protected
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: github-actions/version-bump/${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            version.properties
          commit-message:
            chore: bump build to ${{ steps.bump.outputs.current_build }} for ${{ steps.bump.outputs.current_dev }} on ${{ github.ref_name }} [skip ci]
          title:
            chore: bump build to ${{ steps.bump.outputs.current_build }} for ${{ steps.bump.outputs.current_dev }} on ${{ github.ref_name }}
          body: |
            Automated version bump for `${{ github.ref_name }}`.

            - build: `${{ steps.bump.outputs.current_build }}`
            - version: `${{ steps.bump.outputs.current_dev }}`

      - name: Commit version bump
        if: steps.diff.outputs.changed == 'true' && !github.ref_protected
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump build to ${{ steps.bump.outputs.current_build }} for ${{ steps.bump.outputs.current_dev }} on ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
