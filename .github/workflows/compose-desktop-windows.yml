name: Build Desktop App

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true
          build-scan-publish: false

      - name: Cache Kotlin/Compose
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches/transforms-*
            ~/.gradle/caches/jars-*
          key: ${{ runner.os }}-compose-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-compose-

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Create App Image (Portable)
        run: ./gradlew :composeApp:createDistributable --build-cache

      - name: Upload Portable App
        uses: actions/upload-artifact@v4
        with:
          name: SimAnalyzer-portable
          path: composeApp/build/compose/binaries/main/app/
          retention-days: 7
          compression-level: 9

      - name: Build MSI Installer
        run: ./gradlew :composeApp:packageMsi --build-cache

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SimAnalyzer-msi
          path: composeApp/build/compose/binaries/main/msi/
          retention-days: 7
