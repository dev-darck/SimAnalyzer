name: Compose Desktop (Windows)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build MSI + portable
        shell: bash
        run: |
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :composeApp:createDistributable
          ./gradlew --no-daemon :composeApp:packageDistributionForCurrentOS

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SimAnalyzer-msi-${{ github.ref_name }}-${{ github.sha }}
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Portable (app folder)
        uses: actions/upload-artifact@v4
        with:
          name: SimAnalyzer-portable-${{ github.ref_name }}-${{ github.sha }}
          path: composeApp/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14
