name: Compose Desktop Verify (Windows)

on:
  pull_request:
    branches:
      - "dev"
      - "release"
      - "release/**"

concurrency:
  group: windows-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Run JVM tests (jvmTest)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -PbuildType=debug ciJvmTest
